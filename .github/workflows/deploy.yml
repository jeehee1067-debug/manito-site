# main에 올리면 GitHub Pages로 자동 배포 (방탈출과 같은 호스팅)
# 저장소 Settings > Pages > Source 를 "GitHub Actions" 로 한 번 바꿔 주세요.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 비밀값이 있는지 단계의 if에서 볼 수 있게 환경 변수로 넘긴다(없으면 빈 문자열)
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Firestore 에뮬레이터(보안 규칙 테스트)용
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # (선택) Firebase Hosting에도 같은 빌드를 올린다 → https://s1fa-manito.web.app (github.io보다 짧은 주소)
      # 저장소 Settings > Secrets and variables > Actions에 FIREBASE_SERVICE_ACCOUNT(서비스 계정 키 JSON)를 넣었을 때만 동작한다.
      # 넣지 않으면 이 단계는 건너뛰고 GitHub Pages에만 올린다. 설정 방법은 README "짧은 주소(Firebase Hosting)".
      - name: Deploy to Firebase Hosting
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        # 이 단계가 실패해도(키 권한·Hosting 미설정 등) GitHub Pages 배포는 계속한다
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: s1fa-manito
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
